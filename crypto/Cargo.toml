[package]
name = "elle-crypto"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
elle-plugin = { path = "../../elle-plugin" }
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
